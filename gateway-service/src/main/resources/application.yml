server:
  port: 8080  # Single entry point port!
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: gateway-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # We'll use static routes for now, can enable Eureka/Consul later
      default-filters:
        - name: AddRequestHeader
          args:
            name: X-Gateway-Id
            value: bookpoint-gateway
        - name: AddResponseHeader
          args:
            name: X-Gateway-Response
            value: "Processed by BookPoint Gateway"
      routes:
        # Pedidos Service
        - id: pedidos-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/pedidos/**
          filters:
            - RewritePath=/api/pedidos/(?<segment>.*), /api/pedidos/$\{segment}

        # Auth Service
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/auth/$\{segment}

        # Inventario Service
        - id: inventario-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/productos/**, /api/catalogo/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        # Ventas Service
        - id: ventas-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/ventas/**
          filters:
            - RewritePath=/api/ventas/(?<segment>.*), /api/ventas/$\{segment}

        # Despacho Service
        - id: despacho-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/despacho/**
          filters:
            - RewritePath=/api/despacho/(?<segment>.*), /api/despacho/$\{segment}

        # Clientes Service
        - id: clientes-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/clientes/**
          filters:
            - RewritePath=/api/clientes/(?<segment>.*), /api/clientes/$\{segment}

        # Sucursal Service
        - id: sucursal-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/sucursales/**
          filters:
            - RewritePath=/api/sucursales/(?<segment>.*), /api/sucursales/$\{segment}

        # Bodega Service
        - id: bodega-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/bodega/**
          filters:
            - RewritePath=/api/bodega/(?<segment>.*), /api/bodega/$\{segment}

        # Soporte Service
        - id: soporte-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/soporte/**
          filters:
            - RewritePath=/api/soporte/(?<segment>.*), /api/soporte/$\{segment}

        # Carrito Service
        - id: carrito-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/carrito/**
          filters:
            - RewritePath=/api/carrito/(?<segment>.*), /api/carrito/$\{segment}

      httpclient:
        connect-timeout: 5000  # 5 seconds connection timeout
        response-timeout: 10s  # 10 seconds response timeout

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
  endpoint:
    health:
      show-details: always
