spring.application.name=pedidos-service
server.port=8081

# Configuración de base de datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/bookpoint_pedidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.dfs.demo=DEBUG
logging.level.org.springframework.web=INFO

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Retry
resilience4j.retry.instances.inventarioRetry.maxAttempts=3
resilience4j.retry.instances.inventarioRetry.waitDuration=2s
resilience4j.retry.instances.inventarioRetry.retryExceptions=org.springframework.web.client.ResourceAccessException

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.inventarioCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventarioCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventarioCB.slidingWindowSize=10
