spring.application.name=cart-service
server.port=8091

# Configuración de base de datos MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/bookpoint_cart_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.dfs.cartservice=DEBUG
logging.level.org.springframework.web=INFO

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Configuration
resilience4j.retry.instances.inventario-service.max-attempts=3
resilience4j.retry.instances.inventario-service.wait-duration=2s
resilience4j.retry.instances.inventario-service.retry-exceptions=org.springframework.web.client.ResourceAccessException, org.springframework.web.client.HttpServerErrorException

resilience4j.circuitbreaker.instances.inventario-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventario-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventario-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventario-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventario-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventario-service.permitted-number-of-calls-in-half-open-state=3
